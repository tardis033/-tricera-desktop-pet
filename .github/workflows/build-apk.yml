name: Build TRICERA APK

'on':
  workflow_dispatch:
  push:
    paths:
      - 'TriceraDesktopPet_Source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Check source ZIP
        run: |
          ls -la
          test -f TriceraDesktopPet_Source.zip

      - name: Extract source
        run: unzip TriceraDesktopPet_Source.zip -d source

      - name: Locate Gradle project
        run: |
          find source -type f \( -name build.gradle -o -name build.gradle.kts -o -name gradlew -o -name settings.gradle -o -name settings.gradle.kts \)

      - name: Build APK
        run: |
          PROJECT_DIR="$(dirname "$(find "$GITHUB_WORKSPACE/source" -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)")"
          test -n "$PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug -Pkotlin.jvm.target.validation.mode=warning

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TRICERA-debug-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
