
name: Build TRICERA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Find and extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . \
            -type f \
            -name 'TriceraDesktopPet_Source.zip' \
            -not -path './.git/*' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Cannot find TriceraDesktopPet_Source.zip in the repository."
            exit 1
          fi

          echo "Found source archive: $ZIP_FILE"
          mkdir -p source
          unzip -o "$ZIP_FILE" -d source

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE="$(find source -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Cannot find settings.gradle or settings.gradle.kts under source/."
            find source -maxdepth 4 -type f -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Gradle project: $PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::Cannot find the app Gradle build file."
            exit 1
          fi
      - name: Print pet source files
        shell: bash
        run: |
          find source/tricera_pet -type f -name "PetService.kt" -exec cat {} \;
          find source/tricera_pet -type f -name "MainActivity.kt" -exec cat {} \;
          find source/tricera_pet -type f -name "SettingsActivity.kt" -exec cat {} \;
          
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
     
      - name: Print pet source files
        shell: bash
        run: |
          set -e
          for file in PetService.kt MainActivity.kt SettingsActivity.kt; do
            echo "========== $file =========="
            find source/tricera_pet -type f -name "$file" \
              -exec cat {} \;
            echo
          done
          
      - name: Build debug APK
        shell: bash
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          gradle --version
          gradle assembleDebug \
            -Pkotlin.jvm.target.validation.mode=warning \
            --stacktrace

      - name: Verify APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK_FILE="$(find "${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug" \
            -maxdepth 1 -type f -name '*.apk' -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "::error::Build finished but no debug APK was found."
            exit 1
          fi

          mkdir -p release
          cp "$APK_FILE" release/TRICERA-debug.apk
          echo "APK_PATH=release/TRICERA-debug.apk" >> "$GITHUB_ENV"
          echo "APK ready: release/TRICERA-debug.apk"
          ls -lh release/TRICERA-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TRICERA-debug-APK
          path: release/TRICERA-debug.apk
          if-no-files-found: error
          retention-days: 7
